name: Validar site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Habilitar pnpm fixado pelo projeto
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm check:assets
      - run: pnpm build:hostgator
      - uses: actions/upload-artifact@v4
        with:
          name: glx-hostgator
          path: dist/glx-hostgator.zip
          if-no-files-found: error
